name: Support Agent checks

on:
  pull_request:
    paths:
      - 'extensions/support-agent/**'
      - 'compose.support.yml'
      - 'compose.retrieval.yml'
      - 'compose.operations.yml'
      - 'compose.debug.yml'
      - '.github/workflows/support-agent.yml'
  push:
    paths:
      - 'extensions/support-agent/**'
      - 'compose.support.yml'
      - 'compose.retrieval.yml'
      - 'compose.operations.yml'
      - 'compose.debug.yml'
      - '.github/workflows/support-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/support-agent
    env:
      PYTHONPATH: .:integration
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      # Real evaluation entrypoints, model downloads, .env and local user
      # credentials are deliberately not loaded in this job.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            extensions/support-agent/requirements.txt
            extensions/support-agent/requirements.hybrid.txt
            extensions/support-agent/tests/requirements.txt
      - name: Install test dependencies (CPU; no model weights)
        run: python -m pip install -r requirements.txt -r requirements.hybrid.txt -r tests/requirements.txt
      - name: Compile application and local automation
        run: python -m compileall -q app scripts integration evaluation
      - name: Run deterministic tests with outbound connections blocked
        # FastAPI TestClient uses an in-process ASGI transport. Unit tests of
        # provider clients mock network responses; any accidental real request
        # fails before opening a socket or spending model-provider credit.
        run: |
          python - <<'PY'
          import ipaddress
          import socket
          import pytest

          original_create = socket.create_connection
          original_connect = socket.socket.connect
          original_connect_ex = socket.socket.connect_ex

          def require_local(address):
              if isinstance(address, str):  # Unix socket
                  return
              host = address[0]
              if host == 'localhost':
                  return
              try:
                  if ipaddress.ip_address(host).is_loopback:
                      return
              except ValueError:
                  pass
              raise AssertionError('External network is disabled in Support Agent CI')

          def create(address, *args, **kwargs):
              require_local(address)
              return original_create(address, *args, **kwargs)

          def connect(sock, address):
              require_local(address)
              return original_connect(sock, address)

          def connect_ex(sock, address):
              require_local(address)
              return original_connect_ex(sock, address)

          socket.create_connection = create
          socket.socket.connect = connect
          socket.socket.connect_ex = connect_ex
          raise SystemExit(pytest.main(['-q', 'tests', 'integration']))
          PY
