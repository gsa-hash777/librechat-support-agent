# Local deployment mode: per-user OAuth, trusted local TLS, no debugger/reload.
# Prepare .local/operations.json and .local/support-tls with scripts/init.py/local_tls.ps1.
services:
  api:
    environment:
      NODE_EXTRA_CA_CERTS: /run/support-tls/server.crt
    volumes:
      - ./.local/support-tls/server.crt:/run/support-tls/server.crt:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  support-agent:
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    ports: !override ["127.0.0.1:8090:8090"]
    environment:
      SUPPORT_OPERATIONS_PATH: /run/secrets/operations.json
      SUPPORT_ALLOW_LEGACY_TOOL_KEYS: "false"
      SUPPORT_PUBLIC_BASE_URL: https://localhost:8443
      SUPPORT_TOOL_BASE_URL: https://support-tls:8443
      SUPPORT_SECURE_COOKIES: "true"
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    volumes:
      - ./.local/operations.json:/run/secrets/operations.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/ready',timeout=3)"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  support-tls:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./extensions/support-agent/deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local/support-tls/server.crt:/etc/support-tls/server.crt:ro
      - ./.local/support-tls/server.key:/etc/support-tls/server.key:ro
    depends_on:
      support-agent: {condition: service_healthy}
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && wget -q -O /dev/null http://support-agent:8090/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
